# 검사가 쌓였는데 돌려주는 곳이 없었다.
#
# 백엔드 93건, 프론트 21건, 타입체크, 린트 — 전부 손으로 돌려야 했고 그래서
# 커밋마다 다 돌리지는 않았다. 실제로 그 사이에 조용히 깨진 것을 여러 번 찾았다
# (타입체크가 파일을 하나도 안 보고 있던 것, 린트에 규칙이 둘뿐이던 것).
#
# **무거운 것은 안 돌린다.** 실험(ultralytics·torch)은 GPU가 필요하고 몇 시간이
# 걸린다. 여기서 도는 것은 CSV와 JSON만 읽는 백엔드와 프론트다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      # conftest가 app을 import하므로 backend 안에서 돌아야 한다.
      #
      # **건너뛰는 것이 없다.** 예전에는 학습 가중치가 없어 5건이 빠졌고 제품의
      # 핵심 경로(진단 서브프로세스)가 CI에서 한 번도 안 탔다. 지금은
      # tests/fake_experiment.py가 자리표시자 자와 torch 없는 가짜 스크립트로
      # 그 경계를 흉내 내므로, 인자·cwd·환경변수·리턴코드·결과 JSON 모양까지
      # 실제로 검사된다.
      #
      # 여전히 안 보는 것은 **추론 자체**다. GPU가 필요하고 CI에서 못 한다.
      - run: python -m pytest tests -q
        working-directory: backend

      # 실험 로직 중 **GPU가 필요 없는 것**은 여기서 같이 돈다 (docs/24 B).
      #
      # error_injector는 이 프로젝트 모든 수치의 **정답지를 만드는 코드**이고
      # label_diagnosis는 진단 규칙 자체인데, 둘 다 순수 계산이라 GPU가 없어도
      # 잴 수 있다. 검사 66건이 대회 때부터 있었는데 **CI에서 한 번도 안
      # 돌았다** — experiment/requirements.txt에 torch가 들어 있어서다.
      #
      # 그래서 무거운 것을 뺀 목록을 따로 뒀다. 최소성은 빈 가상환경에서
      # 확인했다.
      - run: pip install -r requirements-ci.txt
        working-directory: experiment
      - run: python -m pytest tests -q
        working-directory: experiment

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # 타입체크를 따로 돌린다. tsc -b는 캐시를 보므로 --force 없이는
      # 아무 파일도 안 볼 수 있다 — 실제로 그런 적이 있다.
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
